<!doctype html>
<!--
  TASK-35's listening harness, kept until the whoosh fix is validated by ear on
  the gated monitor and then deleted — see the task's notes.

  In docs/ rather than public/ on purpose: public/ ships to production, and an
  internal test page has no business there. Open this straight from disk
  (file://) — it needs no server, only a click for the autoplay policy.

  The synthesis numbers in here are HAND-COPIED from components/wheel/sounds.ts
  so the page runs standalone. If sounds.ts is retuned, this page is testing
  the old sound; update it or trust your ears over its buttons.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spinnerly audio lab — tick cold-start tests</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.3rem;
      }
      button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 10px 0;
        padding: 12px 16px;
        font-size: 1rem;
        border-radius: 8px;
        border: 1px solid #bbb;
        background: #f7f7f7;
        cursor: pointer;
      }
      button:hover {
        background: #eee;
      }
      button.armed {
        background: #fde68a;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        background: #111;
        color: #9f9;
        padding: 12px;
        border-radius: 8px;
        min-height: 120px;
      }
      .note {
        color: #666;
        font-size: 0.9rem;
      }
      label {
        display: block;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Tick cold-start listening tests</h1>
    <p class="note">
      The monitor's audio path mutes itself after silence and takes time to
      unmute.
      <strong
        >Wait until the tab's speaker icon has been off for ~10 seconds before
        each cold test</strong
      >, so the monitor is asleep again. Then listen for how many of the opening
      ticks you actually hear.
    </p>

    <button id="b1">
      1 — Cold tick train (reproduces the bug: ticks start 60ms after click)
    </button>
    <button id="b2">
      2 — Current warm(): −52 dBFS noise prime 400ms, ticks 500ms later
    </button>
    <button id="b3">
      3 — LF prime: 40 Hz tone, then ticks. Tune level/lead below.
    </button>
    <button id="b4">
      4 — Toggle continuous 40 Hz keep-alive (then try 1 while it runs)
    </button>
    <button id="b5">
      5 — Ta-da only (the win sound; the kind that always works cold)
    </button>
    <button id="b6">
      <strong>6 — THE FIX: spin-up whoosh + ticks</strong> (what sounds.ts now
      ships — do the cold test on this)
    </button>

    <label
      >LF prime gain (linear):
      <input id="gain" type="number" value="0.05" step="0.01" min="0" max="1" />
      <span class="note">0.05 ≈ −26 dBFS</span></label
    >
    <label
      >LF prime lead before ticks (ms):
      <input id="lead" type="number" value="1500" step="100" min="0"
    /></label>
    <label
      >LF frequency (Hz):
      <input id="freq" type="number" value="40" step="5" min="20"
    /></label>

    <div id="log">log…</div>

    <script>
      let ctx = null
      let keepAlive = null
      const logEl = document.getElementById('log')
      function log(msg) {
        logEl.textContent +=
          '\n' + new Date().toISOString().slice(11, 23) + '  ' + msg
        logEl.scrollTop = logEl.scrollHeight
      }
      function audio() {
        if (!ctx) {
          ctx = new AudioContext()
          log('AudioContext created, state=' + ctx.state)
        }
        if (ctx.state === 'suspended') ctx.resume()
        return ctx
      }
      let noiseBuf = null
      function noise(c) {
        if (noiseBuf) return noiseBuf
        const frames = Math.floor(c.sampleRate * 0.1)
        noiseBuf = c.createBuffer(1, frames, c.sampleRate)
        const ch = noiseBuf.getChannelData(0)
        for (let i = 0; i < frames; i++) ch[i] = Math.random() * 2 - 1
        return noiseBuf
      }
      // Mirrors sounds.ts: ~70 ticks over ~3s, gaps growing 25ms -> 400ms, bandpassed noise.
      function tickTrain(c, startAt) {
        const master = c.createGain()
        master.gain.value = 0.5
        master.connect(c.destination)
        let t = 0
        let gap = 25
        let n = 0
        while (t < 3000 && n < 90) {
          const slow = Math.min(Math.max((gap - 25) / 375, 0), 1)
          const s = c.createBufferSource()
          s.buffer = noise(c)
          const f = c.createBiquadFilter()
          f.type = 'bandpass'
          f.frequency.value = 2400 + (900 - 2400) * slow
          f.Q.value = 0.9
          const g = c.createGain()
          const at = startAt + t / 1000
          g.gain.setValueAtTime(0, at)
          g.gain.linearRampToValueAtTime(1.9 * (1 - 0.35 * slow), at + 0.001)
          g.gain.exponentialRampToValueAtTime(0.0001, at + 0.022)
          s.connect(f)
          f.connect(g)
          g.connect(master)
          s.start(at)
          s.stop(at + 0.022)
          t += gap
          gap = Math.min(gap * 1.09, 400)
          n++
        }
        log(
          'scheduled ' +
            n +
            ' ticks from t+' +
            Math.round((startAt - c.currentTime) * 1000) +
            'ms',
        )
      }
      // Mirrors win() in components/wheel/sounds.ts: a G5 pickup, then C major
      // with a low root and the octave on top, landing together. Chord notes at
      // 0.2 because five of them sum — measured -9.4 dBFS at the destination.
      function flourish(c, startAt) {
        const master = c.createGain()
        master.gain.value = 0.5
        master.connect(c.destination)
        const note = (hz, at, gain, decay) => {
          const o = c.createOscillator()
          o.type = 'triangle'
          o.frequency.value = hz
          const g = c.createGain()
          g.gain.setValueAtTime(0, at)
          g.gain.linearRampToValueAtTime(gain, at + 0.012)
          g.gain.exponentialRampToValueAtTime(0.0001, at + decay)
          o.connect(g)
          g.connect(master)
          o.start(at)
          o.stop(at + decay)
        }
        note(783.99, startAt, 0.6, 0.15)
        for (const hz of [261.63, 523.25, 659.25, 783.99, 1046.5]) {
          note(hz, startAt + 0.15, 0.2, 0.9)
        }
      }
      document.getElementById('b1').onclick = () => {
        const c = audio()
        log('COLD ticks: count how many of the first second you hear')
        tickTrain(c, c.currentTime + 0.06)
      }
      document.getElementById('b2').onclick = () => {
        const c = audio()
        const at = c.currentTime + 0.06
        const s = c.createBufferSource()
        s.buffer = noise(c)
        s.loop = true
        const g = c.createGain()
        g.gain.value = (1.9 / 400) * 0.5 // what warm() ships
        s.connect(g)
        g.connect(c.destination)
        s.start(at)
        s.stop(at + 0.4)
        log('current warm() prime playing (can you hear it? you should not)…')
        tickTrain(c, at + 0.5)
      }
      document.getElementById('b3').onclick = () => {
        const c = audio()
        const gain = parseFloat(document.getElementById('gain').value)
        const lead = parseFloat(document.getElementById('lead').value) / 1000
        const freq = parseFloat(document.getElementById('freq').value)
        const at = c.currentTime + 0.06
        const o = c.createOscillator()
        o.frequency.value = freq
        const g = c.createGain()
        g.gain.value = gain
        o.connect(g)
        g.connect(c.destination)
        o.start(at)
        o.stop(at + lead + 3.5)
        log(
          'LF prime ' +
            freq +
            'Hz @ ' +
            gain +
            ' (audible as a hum?), ticks in ' +
            Math.round(lead * 1000) +
            'ms',
        )
        tickTrain(c, at + lead)
      }
      document.getElementById('b4').onclick = (e) => {
        const c = audio()
        if (keepAlive) {
          keepAlive.stop()
          keepAlive = null
          e.target.classList.remove('armed')
          log('keep-alive OFF')
          return
        }
        const freq = parseFloat(document.getElementById('freq').value)
        const gain = parseFloat(document.getElementById('gain').value)
        const o = c.createOscillator()
        o.frequency.value = freq
        const g = c.createGain()
        g.gain.value = gain
        o.connect(g)
        g.connect(c.destination)
        o.start()
        keepAlive = o
        e.target.classList.add('armed')
        log(
          'keep-alive ON at ' +
            freq +
            'Hz @ ' +
            gain +
            ' — is the tab speaker icon lit?',
        )
      }
      document.getElementById('b5').onclick = () => {
        const c = audio()
        log(
          'ta-da (should always be audible even cold — sustained tone wakes the monitor itself)',
        )
        flourish(c, c.currentTime + 0.06)
      }
      // Mirrors scheduleWhoosh in components/wheel/sounds.ts exactly.
      function whoosh(c, at) {
        const master = c.createGain()
        master.gain.value = 0.5
        master.connect(c.destination)
        const s = c.createBufferSource()
        s.buffer = noise(c)
        s.loop = true
        const f = c.createBiquadFilter()
        f.type = 'bandpass'
        f.frequency.setValueAtTime(300, at)
        f.frequency.exponentialRampToValueAtTime(1500, at + 0.5)
        f.Q.value = 1.4
        const g = c.createGain()
        g.gain.setValueAtTime(0, at)
        g.gain.linearRampToValueAtTime(2.0, at + 0.04)
        g.gain.setValueAtTime(2.0, at + 0.29)
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5)
        s.connect(f)
        f.connect(g)
        g.connect(master)
        s.start(at)
        s.stop(at + 0.5)
      }
      document.getElementById('b6').onclick = () => {
        const c = audio()
        const at = c.currentTime + 0.06
        log('WHOOSH + ticks, cold: are the ticks there from the start?')
        whoosh(c, at)
        tickTrain(c, at)
      }
    </script>
  </body>
</html>
